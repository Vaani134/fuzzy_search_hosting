[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Pure unit tests (no DB, no Flask)
    integration: Integration tests using Flask test client + SQLite
    performance: Latency benchmark tests
    concurrency: Thread-safety and race condition tests
    memory: Memory leak detection tests
    slow: Tests that take > 5s

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --json-report
    --json-report-file=tests/reports/.pytest_report.json

# Ignore the venv and load test dirs from collection
norecursedirs = venv .venv __pycache__ .git tests/load

# Minimum pytest version
minversion = 7.0
